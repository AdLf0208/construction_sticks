# Construction Sticks for Horizon — plane construction with durable sticks, one flat SDK package.
#
# Migrated 2026-11-18 from the retired `.hnmod` container (Horizon's mod-API merge
# #16941; the registry closed submission #868 with the format purge). The manifest
# below is the only one: identity, the content capability and the exact native pins.
# `assets/` and `data/` are the carried content (the five sticks, their models,
# textures, recipes, tags and advancements), `src/` is the port's code; both halves
# travel in one file, which is the point of the SDK layout.
#
# Licence: MIT, read from the jar's `META-INF/neoforge.mods.toml` and the upstream
# repository's LICENSE (rank 0, permissive). `LICENSE` and `LICENSE-NOTICE.md` travel
# inside the package. Local-only until the maintainer approves publishing
# (ARCHITECTURE.md §8).
id = "constructionstick"
name = "Construction Sticks"
version = "0.2.5"
description = """A port of Construction Sticks for Horizon: a construction stick right-clicked on a
block fills the face's plane with copies of the clicked block, bounded by the stick's tier
(3/9/27/128/1024 blocks), its remaining durability and the player's supply, paying one item of the
block's kind and one durability per placed block. The angel, destruction and replacement modes, the upgrade
templates, the battery and the options screen/undo are not ported yet."""
authors = ["Mrbysco", "AdLf0208"]
# The content API: exact and checked. This package ships carried content beside its code,
# so the capability is a real claim; it is also the one value the manifest schema has.
api = "0.2"
# The installation side, not the hook's: an integrated server belongs to the client
# installation, so a LAN host or a single-player world needs both.
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
