[package]
# Port of Construction Sticks 1.5.0 (Mrbysco/ConstructionSticks, MIT). Minecraft Java
# 1.21.1 NeoForge; the port targets Horizon 26.3 at the pin in horizon-mod.toml.
# Clean-room Rust rewrite from the mod's behaviour (see notes.md and FINDINGS.md).
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "constructionstick"
version = "0.2.5"
edition = "2024"
license = "MIT"
description = "Construction Sticks for Horizon: a stick fills the clicked face's plane with copies of the clicked block"
publish = false

[lib]
# The pure planner is `src/runtime.rs`; the crate root is `src/lib.rs`.
path = "src/lib.rs"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod`
# command (the launcher builds against its own copy of the same build). This port
# adds no registry dependency of its own.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
